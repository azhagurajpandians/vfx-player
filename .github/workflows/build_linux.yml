name: Build Linux Packages

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux AppImage & Tarball
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            libgl1 \
            libegl1 \
            libglu1-mesa \
            libglib2.0-0 \
            libfontconfig1 \
            libfreetype6 \
            libxcb-cursor0 \
            libxcb-xinerama0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-sync1 \
            libxcb-xfixes0 \
            libxcb-xinput0 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libfuse2 \
            python3-openimageio \
            xvfb \
            wget \
            curl \
            file

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements-linux.txt
          python -c "
          import sys, os, glob
          site_pkg = [p for p in sys.path if 'site-packages' in p][-1]
          patterns = ['/usr/lib/python3/dist-packages/*OpenImageIO*', '/usr/lib/x86_64-linux-gnu/python3/dist-packages/*OpenImageIO*']
          for p in patterns:
              for item in glob.glob(p):
                  dst = os.path.join(site_pkg, os.path.basename(item))
                  if not os.path.exists(dst):
                      try:
                          os.symlink(item, dst)
                          print(f'Linked {item} -> {dst}')
                      except Exception as e:
                          pass
          " || true

      - name: Run Test Suite
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: "/usr/lib/x86_64-linux-gnu/python3/dist-packages:/usr/lib/python3/dist-packages"
        run: |
          xvfb-run -a python -m unittest discover -s tests

      - name: Make Scripts Executable
        run: |
          chmod +x build_linux.sh build_appimage.sh

      - name: Build Linux Distribution & AppImage
        run: |
          ./build_linux.sh
          ./build_appimage.sh

      - name: Upload Linux Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vfx-player-linux-packages
          path: dist_linux/*
          if-no-files-found: error

      - name: Release Assets (On Release Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist_linux/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
